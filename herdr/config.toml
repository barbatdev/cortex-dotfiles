onboarding = false
[keys]
prefix = "ctrl+a"
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"
focus_agent = "prefix+ctrl+1..9"

[ui.toast]
delivery = "terminal"

[ui]
sidebar_width = 32
sidebar_min_width = 24
sidebar_max_width = 42
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = true
pane_borders = true
pane_gaps = true
accent = "#7127FF"

status_indicators = "symbols"
[terminal]
new_cwd = "follow"

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = false

[theme]
# One Dark supplies structural defaults; every visible custom role is RefactorIA.
name = "one-dark"
auto_switch = false

[theme.custom]
panel_bg = "#0B0714"
sidebar_bg = "#17102A"
active_row_bg = "#2C2144"
selection_bg = "#7127FF"
surface0 = "#17102A"
surface1 = "#2C2144"
surface_dim = "#0B0714"
overlay0 = "#EBEBEB"
overlay1 = "#F2EFFA"
text = "#FFFFFF"
subtext0 = "#EBEBEB"
accent = "#FFC857"
blue = "#8CC8FF"
red = "#FF6B8A"
green = "#58E6A8"
yellow = "#FFC857"
mauve = "#C7A6FF"
teal = "#66E6E6"
peach = "#FFC857"

[ui.sound]
enabled = true
