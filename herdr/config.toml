panel_bg = "#27231D"
element_bg = "#39342C"
text = "#F8F1E7"
muted = "#B9AD9C"
subtle = "#7D7468"
accent = "#F97316"
accent_hover = "#FB923C"
blue = "#60A5FA"
red = "#F87171"
green = "#10B981"
yellow = "#FBBF24"
purple = "#A78BFA"
cyan = "#2DD4BF"
diff_added_bg = "#0D2A20"
diff_removed_bg = "#2C1210"
