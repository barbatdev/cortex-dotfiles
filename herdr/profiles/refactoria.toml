# RefactorIA Herdr profile. Loaded after the shared default config.

[theme]
# One Dark supplies structural defaults; every visible custom role is RefactorIA.
name = "one-dark"
auto_switch = false

[theme.custom]
panel_bg = "#0B0714"
sidebar_bg = "#17102A"
active_row_bg = "#2C2144"
selection_bg = "#7127FF"
surface0 = "#17102A"
surface1 = "#2C2144"
surface_dim = "#0B0714"
overlay0 = "#EBEBEB"
overlay1 = "#F2EFFA"
text = "#FFFFFF"
subtext0 = "#EBEBEB"
accent = "#FFC857"
blue = "#8CC8FF"
red = "#FF6B8A"
green = "#58E6A8"
yellow = "#FFC857"
mauve = "#C7A6FF"
teal = "#66E6E6"
peach = "#FFC857"

[ui]
accent = "#7127FF"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"
