# Fuente
font-family = FiraCode Nerd Font Mono Beard
font-size = 14

# Paleta InnIT Tech Slate (tokens de innit.com.uy)
background = #0F1419
foreground = #F6F8FA
cursor-color = #3FB950
cursor-text = #0F1419
selection-background = #2D333B
selection-foreground = #F6F8FA

# Colores ANSI normales
palette = 0=#0F1419
palette = 1=#F85149
palette = 2=#3FB950
palette = 3=#D29922
palette = 4=#0054ff
palette = 5=#8B5CF6
palette = 6=#58A6FF
palette = 7=#F6F8FA

# Colores brillantes
palette = 8=#57606A
palette = 9=#ff6b64
palette = 10=#4CC55E
palette = 11=#E3B341
palette = 12=#1a68ff
palette = 13=#A78BFA
palette = 14=#79C0FF
palette = 15=#FFFFFF

# Transparencia
background-opacity = 1.0
unfocused-split-opacity = 0.85

# Ventana
window-decoration = true
window-padding-balance = true
window-step-resize = false
macos-titlebar-style = tabs
window-padding-x = 4
window-padding-y = 2

# Cursor
cursor-style = block_hollow

# Shaders desactivados en modo trabajo remoto: reducen legibilidad en multiplexers.
# custom-shader = shaders/cursor_smear_soft.glsl

# Integración con shell
shell-integration = zsh

# Option izquierdo como Alt para TUIs; Option derecho conserva tildes/ñ.
macos-option-as-alt = left

# Comportamiento
scrollback-limit = 10000
copy-on-select = clipboard
right-click-action = paste

# Splits
keybind = cmd+shift+d=new_split:down
keybind = cmd+shift+z=toggle_split_zoom
keybind = ctrl+opt+left=resize_split:left,20
keybind = ctrl+opt+right=resize_split:right,20
keybind = ctrl+opt+up=resize_split:up,20
keybind = ctrl+opt+down=resize_split:down,20
keybind = ctrl+opt+equal=equalize_splits
