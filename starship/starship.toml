# Formato general
format = """
${custom.repo}\
[|](fg:color_brand)\
$directory\
[|](fg:color_brand)\
$git_branch\
$git_status\
[|](fg:color_brand)\
${custom.sdd_auto}\
${custom.sdd_interactive}\
$nodejs\
$python\
$status\
$line_break$character"""

# Módulos alineados a la derecha
right_format = """$cmd_duration$time"""

palette = 'refactoria'

[palettes.refactoria]
color_fg0 = '#FFFFFF'
color_base = '#0B0714'
color_surface = '#17102A'
color_panel = '#2C2144'
color_brand = '#7127FF'
color_accent = '#A477FF'
color_success = '#58E6A8'
color_info = '#8CC8FF'
color_warning = '#FFC857'
color_beard = '#FFDE70'
color_error = '#FF6B8A'

[os]
disabled = true
style = "bg:color_surface fg:color_fg0"

[os.symbols]
Macos = "macOS"
Windows = "Windows"
Ubuntu = "Ubuntu"
Linux = "Linux"

[username]
show_always = false
style_user = "bg:color_surface fg:color_fg0"
style_root = "bg:color_surface fg:color_fg0"
format = '[ $user ]($style)'

[directory]
style = "fg:color_fg0 bg:color_panel"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"dev" = "dev"
"dev/work" = "work"
"dev/personal" = "personal"
"Documents" = "Documents"
"Downloads" = "Downloads"
"Pictures" = "Pictures"

[git_branch]
symbol = ""
style = "bg:color_info"
format = '[[ $branch ](fg:color_base bg:color_info)]($style)'
truncation_length = 24
truncation_symbol = "…"

[git_status]
style = "bg:color_info"
format = '[[($all_status$ahead_behind )](fg:color_base bg:color_info)]($style)'
ahead = '↑${count}'
behind = '↓${count}'
diverged = '⇅↑${ahead_count}↓${behind_count}'
conflicted = '=${count}'
deleted = ''
modified = '!${count}'
renamed = ''
staged = '+${count}'
stashed = ''
untracked = '?${count}'

[custom.repo]
description = "Nombre corto del repo actual"
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"
shell = ["bash", "--noprofile", "--norc"]
command = "basename \"$(git rev-parse --show-toplevel 2>/dev/null)\" | cut -c1-24"
style = "fg:color_fg0 bg:color_brand"
format = '[ $output ]($style)'

[custom.sdd_auto]
description = "Estado SDD auto del proyecto"
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1 && test -f .ai/sdd-session.json && (jq -r '.execution_mode // empty' .ai/sdd-session.json 2>/dev/null || python3 -c \"import json; print(json.load(open('.ai/sdd-session.json')).get('execution_mode',''))\" 2>/dev/null) | grep -qx 'auto'"
shell = ["bash", "--noprofile", "--norc"]
command = "printf 'sdd:auto'"
style = "fg:color_success bg:color_surface"
format = '[ $output ]($style)'

[custom.sdd_interactive]
description = "Estado SDD interactivo del proyecto"
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1 && test -f .ai/sdd-session.json && (jq -r '.execution_mode // empty' .ai/sdd-session.json 2>/dev/null || python3 -c \"import json; print(json.load(open('.ai/sdd-session.json')).get('execution_mode',''))\" 2>/dev/null) | grep -qx 'interactive'"
shell = ["bash", "--noprofile", "--norc"]
command = "printf 'sdd:interactive'"
style = "fg:color_accent bg:color_surface"
format = '[ $output ]($style)'

[nodejs]
symbol = ""
style = "bg:color_panel"
format = '[[ node($version) ](fg:color_info bg:color_panel)]($style)'
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]

[python]
symbol = ""
style = "bg:color_panel"
format = '[[ py($version) ](fg:color_info bg:color_panel)]($style)'
detect_files = ["pyproject.toml", "requirements.txt", "requirements-dev.txt", ".python-version", "uv.lock", "Pipfile"]
detect_folders = [".venv", "venv"]

[docker_context]
disabled = true

[status]
disabled = false
style = "fg:color_error bg:color_base"
symbol = 'x'
format = '[ $symbol$status ]($style)'

[cmd_duration]
min_time = 500
style = "bg:color_surface"
format = '[[  $duration ](fg:color_warning bg:color_surface)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_surface"
format = '[[  $time ](fg:color_fg0 bg:color_surface)]($style)'

[battery]
full_symbol = '󰁹'
charging_symbol = '󰂄'
discharging_symbol = '󰂃'
format = '[$symbol$percentage ]($style)'

[[battery.display]]
threshold = 20
style = "bold color_error"

[[battery.display]]
threshold = 50
style = "bold color_warning"

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[󰼀](fg:color_beard) '
error_symbol = '[󰼀](fg:color_error) '
vimcmd_symbol = '[󰼀](fg:color_info) '
vimcmd_replace_one_symbol = '[󰼀](fg:color_accent) '
vimcmd_replace_symbol = '[󰼀](fg:color_accent) '
vimcmd_visual_symbol = '[󰼀](fg:color_warning) '
