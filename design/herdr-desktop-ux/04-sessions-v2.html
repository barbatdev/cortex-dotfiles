<html lang="en">
<head>
<meta charset="utf-8">
<title>Herdr Desktop — Sidebar 04 · Sessions v2 · calm idle</title>
<style>
:root{
  --bg:#0B0714;--surface:#17102A;--raised:#2C2144;--fg:#FFFFFF;--muted:#EBEBEB;--dim:#F2EFFA;
  --accent:#A477FF;--solid:#7127FF;--spark:#FFB547;--working:#8CC8FF;--blocked:#FFC857;--done:#58E6A8;--error:#FF6B8A;--unknown:#C7A6FF;--grey:#8F839D;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;background:var(--bg);color:var(--fg);font:12px/1.4 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
header.top{height:60px;display:flex;align-items:center;gap:14px;padding:0 40px}
header.top h1{font-size:15px;font-weight:600}
header.top p{color:var(--grey);font-size:12px}
main{display:flex;gap:44px;justify-content:center;padding:0 40px}
.col{display:flex;flex-direction:column;gap:10px;width:300px}
figcaption{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
figcaption .k{width:20px;height:20px;border-radius:6px;background:var(--surface);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:11px}
aside{width:300px;height:790px;background:var(--surface);border:1px solid var(--raised);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.scroll{overflow:auto;flex:1;padding:0 8px 14px;scrollbar-width:thin;scrollbar-color:#2C2144 transparent}
.brand{display:flex;align-items:center;gap:10px;padding:14px 14px 6px}
.brand b{font-size:14px;letter-spacing:.2px}.brand b span{color:var(--accent)}
.brand small{display:block;color:var(--grey);font-size:10.5px}
h2{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--grey);padding:14px 8px 6px}
h2 .n{color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--spark);outline-offset:2px;border-radius:6px}
svg{flex:none}
.lnk{color:var(--accent);font-size:10.5px;text-decoration:underline;text-underline-offset:2px;min-height:24px}
.lnk.sm{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.btn{font-size:11px;padding:4px 10px;border-radius:6px;min-height:26px}
.btn.primary{background:var(--solid);color:#fff;font-weight:600}
.btn.ghost{border:1px solid var(--unknown);color:var(--muted)}
.acts{display:flex;gap:6px}
/* spaces */
.sps{list-style:none;display:flex;flex-direction:column;gap:1px}
.sp{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px}
.sp:hover{background:var(--raised)}
.av{width:20px;height:20px;border-radius:5px;background:var(--raised);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--accent)}
.sn{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sst{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:10.5px;white-space:nowrap}
.sst svg{width:11px;height:11px}
.sp:hover .sst[style*="grey"]{color:var(--unknown)!important}
/* calm block */
.calmbox{background:var(--bg);border:1px solid var(--raised);border-radius:12px;padding:14px 14px 13px;margin:0 2px}
.ch{display:flex;gap:11px;align-items:flex-start}
.moon{width:30px;height:30px;color:var(--accent)}
.ct{font-size:14px;font-weight:600}
.cs{font-size:12px;color:var(--dim);margin-top:2px}
.today{display:grid;grid-template-columns:repeat(2,1fr);row-gap:10px;margin:14px 0 4px;border-top:1px solid var(--raised);padding-top:11px}
.today div{display:flex;align-items:baseline;gap:7px}
.today dd{order:-1;font-size:17px;min-width:20px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg)}
.today dt{font-size:11px;color:var(--grey);display:flex;align-items:center;gap:3px;white-space:nowrap}
.today dt svg{width:10px;height:10px}
.tod{font-size:10.5px;color:var(--grey);margin:8px 0 12px}
.last{border-top:1px solid var(--raised);padding-top:11px}
.lk{font-size:10.5px;color:var(--done);display:flex;gap:4px;align-items:center}
.lt{display:flex;gap:7px;align-items:center;font-size:13px;font-weight:500;margin-top:5px}
.ld{font-size:11.5px;color:var(--dim);margin:2px 0 10px 21px}
.last .acts{margin-left:21px}
.pg{width:14px;height:14px;color:var(--unknown)}
/* cards (from 02) */
.cards{display:flex;flex-direction:column;gap:8px}
.card{position:relative;background:var(--bg);border:1px solid var(--raised);border-radius:10px;padding:10px 11px 9px}
.card::before{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--rail)}
.card:hover,.card.sel{background:var(--raised);border-color:var(--rail)}
.card .hd{display:flex;align-items:center;gap:7px}
.card .name{flex:1;min-width:0;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--rail);padding:2px 7px 2px 5px;border-radius:999px;border:1px solid var(--rail);white-space:nowrap}
.pill svg{width:11px;height:11px}
.card .sub{font-size:11.5px;color:var(--muted);margin:2px 0 0 21px}
.card .body{margin:7px 0 0 21px}
.ask{font-size:12.5px;color:var(--fg);border-left:2px solid var(--blocked);padding:2px 0 2px 8px;margin:6px 0 8px 21px}
.err{font-size:11.5px;color:var(--error);margin:6px 0 8px 21px}
.card .acts{margin-left:21px}
.prog{display:flex;align-items:center;gap:8px}
.bar{flex:1;height:4px;border-radius:4px;background:var(--bg);overflow:hidden;box-shadow:inset 0 0 0 1px #2C2144}
.bar i{display:block;height:100%;background:var(--working);border-radius:4px}
.prog span{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--dim);padding:3px 8px 3px 6px;border-radius:6px;background:var(--bg);border:1px solid var(--raised)}
.chip svg{width:11px;height:11px}
.card .meta{margin:7px 0 0 21px;font-size:10.5px;color:var(--grey);display:flex;align-items:center;gap:5px}
.card:hover .meta,.card.sel .meta{color:var(--unknown)}
.card .meta svg{width:11px;height:11px}
/* idle groups */
.gh3{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;padding:10px 8px 3px;color:var(--grey)}
.gh3 span{font-weight:500;color:var(--grey)}
.gh3.now,.gh3.now span{color:var(--accent)}
.gh3.hour{color:var(--muted)}
.il{list-style:none;display:flex;flex-direction:column;gap:1px}
.ir{display:grid;grid-template-columns:14px 1fr;column-gap:8px;width:100%;padding:6px 8px;border-radius:8px;min-height:44px}
.ir:hover{background:var(--raised)}
.st{width:12px;height:12px;margin-top:2px;color:var(--grey)}
.st.done{color:var(--done)}
.l1{display:flex;align-items:center;gap:6px;min-width:0}
.l1 .pg{width:12px;height:12px}
.nm{font-size:12.5px;font-weight:500;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ir.earlier .nm{color:var(--muted);font-weight:400}
.new{font-size:9.5px;font-weight:700;color:var(--bg);background:var(--done);padding:1px 5px;border-radius:4px;letter-spacing:.3px}
.l2{grid-column:2;display:flex;gap:8px;font-size:11px;color:var(--grey);margin-top:2px;min-width:0}
.ir.now .l2,.ir.hour .l2 .tk{color:var(--dim)}
.tk{flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.age{margin-left:auto;font-size:10.5px;color:var(--grey);font-variant-numeric:tabular-nums;white-space:nowrap}
.ir.now .age{color:var(--done)}
.ir:hover .age{color:var(--unknown)}
.wh{flex:none;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;color:var(--grey);font-variant-numeric:tabular-nums}
.wh svg{width:10px;height:10px}
.ir:hover .l2,.ir:hover .wh,.ir:hover .tk{color:var(--unknown)}
.ir.now{background:linear-gradient(90deg,#2C2144 0,#17102A 85%)}
.ir.now .wh{color:var(--dim)}
.more{display:flex;align-items:center;gap:4px;width:100%;padding:6px 8px 6px 30px;font-size:11px;color:var(--accent);border-radius:7px;min-height:28px}
.more svg{width:11px;height:11px}
.more:hover{background:var(--raised)}
.hid{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--grey);padding:10px 8px 0}
.hid svg{width:12px;height:12px}
@media (prefers-reduced-motion:no-preference){.spin{animation:spin 1.6s linear infinite;transform-origin:50% 50%}@keyframes spin{to{transform:rotate(360deg)}}}
</style>
</head>
